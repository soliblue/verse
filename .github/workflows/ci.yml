name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Transcription backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test transcription API and storage
        run: |
          python3 -m compileall -q speech_server
          python3 -m unittest discover -s speech_server -t . -p 'test_*.py' -v

  ios:
    name: iOS build and smoke test
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Start simulator
        run: |
          IOS_RUNTIME="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; rows=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["name"].startswith("iOS")]; print(max(rows, key=lambda x: tuple(map(int, x["version"].split("."))))["identifier"])')"
          SMOKE_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(x["udid"] for x in json.load(sys.stdin)["devices"][sys.argv[1]] if x["name"].startswith("iPhone") and x["state"] == "Shutdown"))' "$IOS_RUNTIME")"
          echo "SMOKE_UDID=$SMOKE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SMOKE_UDID"

      - name: Build without signing
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/ios/Verse.xcodeproj \
            -scheme Verse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SMOKE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/verse-build" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Wait for simulator
        timeout-minutes: 6
        run: |
          xcrun simctl bootstatus "$SMOKE_UDID" -b

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -project apps/ios/Verse.xcodeproj \
            -scheme Verse \
            -destination "platform=iOS Simulator,id=$SMOKE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/verse-build" \
            -resultBundlePath "$RUNNER_TEMP/verse-unit-tests.xcresult" \
            -only-testing:VerseTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export native unit summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ -d "$RUNNER_TEMP/verse-unit-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/verse-unit-tests.xcresult" \
              > "$RUNNER_TEMP/verse-unit-summary.json"
          fi

      - name: Upload native unit summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verse-native-unit-summary
          path: ${{ runner.temp }}/verse-unit-summary.json
          if-no-files-found: ignore

      - name: Run UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project apps/ios/Verse.xcodeproj \
            -scheme Verse \
            -destination "platform=iOS Simulator,id=$SMOKE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/verse-build" \
            -resultBundlePath "$RUNNER_TEMP/verse-ui-tests.xcresult" \
            -only-testing:VerseUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export native UI summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ -d "$RUNNER_TEMP/verse-ui-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/verse-ui-tests.xcresult" \
              > "$RUNNER_TEMP/verse-ui-summary.json"
          fi

      - name: Capture smoke screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          APP="$RUNNER_TEMP/verse-build/Build/Products/Debug-iphonesimulator/Verse.app"
          mkdir -p "$RUNNER_TEMP/verse-smoke"
          xcrun simctl install "$SMOKE_UDID" "$APP"
          xcrun simctl ui "$SMOKE_UDID" appearance light
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing
          sleep 5
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/transcriptions-light.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing
          sleep 3
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-ready-controller-fixture.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --keyboard-cold-ui-testing
          sleep 3
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-cold-controller-fixture.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --keyboard-dark-ui-testing
          sleep 3
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-dark-controller-fixture.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --keyboard-processing-ui-testing
          sleep 3
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-processing-controller-fixture.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --typing-keyboard-ui-testing
          sleep 3
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/keyboard-controller-fixture.png"
          xcrun simctl launch --terminate-running-process "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --keyboard-wave-ui-testing
          sleep 2
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-recording-controller-fixture.png"
          xcrun simctl io "$SMOKE_UDID" recordVideo --codec=h264 "$RUNNER_TEMP/verse-smoke/voice-wave-synthetic-10hz.mov" &
          RECORD_PID=$!
          sleep 10
          kill -INT "$RECORD_PID"
          wait "$RECORD_PID"
          xcrun simctl terminate "$SMOKE_UDID" soli.verse
          xcrun simctl io "$SMOKE_UDID" recordVideo --codec=h264 "$RUNNER_TEMP/verse-smoke/voice-switch-controller-fixture.mov" &
          RECORD_PID=$!
          sleep 1
          xcrun simctl launch "$SMOKE_UDID" soli.verse --ui-testing --keyboard-ui-testing --keyboard-cold-ui-testing --keyboard-switch-ui-testing --keyboard-switch-video-ui-testing
          sleep 10
          xcrun simctl io "$SMOKE_UDID" screenshot "$RUNNER_TEMP/verse-smoke/voice-switch-controller-fixture.png"
          kill -INT "$RECORD_PID"
          wait "$RECORD_PID"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/verse-ui-tests.xcresult" \
            --output-path "$RUNNER_TEMP/verse-smoke/ui-tests"

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verse-ios-evidence
          path: |
            ${{ runner.temp }}/verse-smoke
            ${{ runner.temp }}/verse-unit-summary.json
            ${{ runner.temp }}/verse-ui-summary.json
            ${{ runner.temp }}/verse-*-tests.xcresult
          if-no-files-found: ignore

      - name: Shut down simulator
        if: always() && env.SMOKE_UDID != ''
        run: xcrun simctl shutdown "$SMOKE_UDID"
