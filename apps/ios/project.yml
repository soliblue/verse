name: Verse
packages:
  Argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
options:
  bundleIdPrefix: soli
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
targets:
  Verse:
    type: application
    platform: iOS
    sources:
      - path: src
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: Argmax
        product: WhisperKit
      - target: VerseKeyboard
      - target: VerseShare
      - target: VerseControls
    info:
      path: src/Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Verse.entitlements
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Verse
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        MARKETING_VERSION: 0.3.1
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse
        PRODUCT_NAME: Verse
        SWIFT_APPROACHABLE_CONCURRENCY: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VERSE_APP"
  VerseControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - path: Shared
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse.controls
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VERSE_WIDGET"
  VerseKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: [Info.plist]
      - path: Shared
    info:
      path: Keyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse.keyboard
        CODE_SIGN_ENTITLEMENTS: Verse.entitlements
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  VerseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes: [Info.plist]
      - path: Shared
    info:
      path: Share/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse.share
        CODE_SIGN_ENTITLEMENTS: Verse.entitlements
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  VerseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Verse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse.tests
  VerseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Verse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: soli.verse.uitests
schemes:
  Verse:
    build:
      targets:
        Verse: all
        VerseTests: [test]
        VerseUITests: [test]
    test:
      targets:
        - VerseTests
        - VerseUITests
    run:
      config: Debug
    archive:
      config: Release
